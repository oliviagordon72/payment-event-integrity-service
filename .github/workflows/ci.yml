name: integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: payments_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payments -d payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://payments:test-only@localhost:5432/payments_test?sslmode=disable
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go test ./internal/service -run '^$' -fuzz '^FuzzVerifySignature$' -fuzztime=10s
      - run: go test ./internal/service -run '^$' -fuzz '^FuzzDecodeNormalize$' -fuzztime=10s
      - run: docker build -t payment-integrity:test .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
